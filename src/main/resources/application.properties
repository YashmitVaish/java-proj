# Default settings. Every key can be overridden from the .env file or an environment variable
# with the same name in UPPER_CASE with _ instead of dots, e.g. server.port -> SERVER_PORT.

# SQLite database file (created on first start)
db.path=khata.db

server.port=8080

# must be set in .env (JWT_SECRET), at least 32 characters
jwt.secret=
jwt.expiration.hours=24

# comma separated list of frontend origins allowed to call the API
cors.allowed.origins=http://localhost:3000
